<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Counters</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { box-sizing: border-box; margin: 0; min-height: 100vh; padding: 2rem 1rem; display: grid; place-items: center; background: Canvas; color: CanvasText; }
    main { width: min(100%, 34rem); padding: 2rem; box-sizing: border-box; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 1rem; }
    h1 { margin-top: 0; }
    .actions { display: grid; gap: .75rem; margin: 1.5rem 0; }
    a, button { font: inherit; }
    .button { display: inline-block; padding: .75rem 1rem; border: 0; border-radius: .5rem; background: #1769aa; color: white; text-align: center; text-decoration: none; cursor: pointer; }
    .secondary { background: color-mix(in srgb, CanvasText 12%, Canvas); color: CanvasText; }
    .url-row { display: flex; gap: .5rem; }
    .url-row input { min-width: 0; flex: 1; padding: .65rem; }
    .hint { color: color-mix(in srgb, CanvasText 65%, transparent); }
    #message { min-height: 1.5em; }
    @media (max-width: 420px) { main { padding: 1.25rem; } .url-row { flex-direction: column; } }
  </style>
  <script src="frontend.js" defer></script>
</head>
<body>
  <main>
    <h1>Event Counters</h1>
    <p id="message" role="status">Checking your counter link…</p>
    <section id="links" hidden>
      <div class="actions">
        <a id="manage-link" class="button" href="frontend.html">Manage Counters</a>
        <a class="button secondary" href="./app-debug.apk">Download Android app</a>
      </div>
      <label for="backend-url">Backend URL</label>
      <p class="hint">Use this private URL to configure the Android widget. Anyone with it can access these counters.</p>
      <div class="url-row">
        <input id="backend-url" type="text" readonly>
        <button id="copy-url" class="button secondary" type="button">Copy URL</button>
      </div>
    </section>
  </main>
</body>
</html>
